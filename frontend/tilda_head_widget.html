<!-- Vassian FAQ/RAG chat widget - for Tilda "Настройки сайта → Вставка кода → HTML-код для вставки внутрь HEAD".
     Site-wide: this insertion point runs on every page. The <style> tag is valid directly in <head>;
     the widget's own DOM (button, chat window, messages, input) is built by JS after the page loads,
     then appended to <body> - <head> itself has no <body> to attach to yet at parse time. -->
<style>
  #vassian-faq-widget {
    --bg: #f4f5f7;
    --text: #1f2430;
    --card: #ffffff;
    --border: #dde1e7;
    --accent: #2f6fed;
    --accent-dark: #244fb0;
    --user-bubble: #2f6fed;
    --user-text: #ffffff;
    --bot-bubble: #eef1f6;
    --bot-text: #1f2430;
    --muted: #6b7280;

    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    color: var(--text);
  }

  #vassian-faq-widget,
  #vassian-faq-widget * {
    box-sizing: border-box;
  }

  /* --- launcher button --- */
  #vassian-faq-widget .chat-launcher {
    position: fixed;
    bottom: 24px;
    right: 24px;
    width: 60px;
    height: 60px;
    border-radius: 999px;
    background: var(--accent);
    color: #fff;
    border: none;
    cursor: pointer;
    box-shadow: 0 8px 24px rgba(47, 111, 237, 0.35);
    font-size: 26px;
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 1000;
  }

  #vassian-faq-widget .chat-launcher:hover {
    background: var(--accent-dark);
  }

  /* --- chat window --- */
  #vassian-faq-widget .chat-widget {
    position: fixed;
    bottom: 96px;
    right: 24px;
    width: 360px;
    max-width: calc(100vw - 32px);
    height: 520px;
    max-height: calc(100vh - 140px);
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 16px;
    box-shadow: 0 20px 50px rgba(15, 23, 42, 0.18);
    display: none;
    flex-direction: column;
    overflow: hidden;
    z-index: 1000;
  }

  #vassian-faq-widget .chat-widget.open {
    display: flex;
  }

  #vassian-faq-widget .chat-header {
    padding: 14px 16px;
    background: var(--accent);
    color: #fff;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }

  #vassian-faq-widget .chat-header-title {
    font-size: 14px;
    font-weight: 600;
  }

  #vassian-faq-widget .chat-header-subtitle {
    font-size: 11px;
    opacity: 0.85;
  }

  #vassian-faq-widget .chat-close {
    background: transparent;
    border: none;
    color: #fff;
    font-size: 18px;
    cursor: pointer;
    line-height: 1;
    padding: 4px;
  }

  #vassian-faq-widget .chat-messages {
    flex: 1;
    overflow-y: auto;
    padding: 14px;
    display: flex;
    flex-direction: column;
    gap: 8px;
    background: var(--bg);
  }

  #vassian-faq-widget .chat-message {
    max-width: 82%;
    padding: 9px 12px;
    border-radius: 14px;
    font-size: 13.5px;
    line-height: 1.4;
    white-space: pre-wrap;
    word-wrap: break-word;
  }

  #vassian-faq-widget .chat-message.user {
    align-self: flex-end;
    background: var(--user-bubble);
    color: var(--user-text);
    border-bottom-right-radius: 4px;
  }

  #vassian-faq-widget .chat-message.assistant {
    align-self: flex-start;
    background: var(--bot-bubble);
    color: var(--bot-text);
    border-bottom-left-radius: 4px;
  }

  #vassian-faq-widget .chat-message.status {
    align-self: flex-start;
    color: var(--muted);
    font-size: 12.5px;
    font-style: italic;
    padding: 2px 4px;
  }

  #vassian-faq-widget .chat-message.error {
    align-self: flex-start;
    background: #fde2e1;
    color: #8a1f1f;
    border-bottom-left-radius: 4px;
  }

  #vassian-faq-widget .chat-footer {
    border-top: 1px solid var(--border);
    padding: 10px;
    display: flex;
    gap: 8px;
    align-items: flex-end;
    background: var(--card);
  }

  #vassian-faq-widget .chat-input {
    flex: 1;
    resize: none;
    max-height: 90px;
    padding: 8px 10px;
    border-radius: 10px;
    border: 1px solid var(--border);
    font-family: inherit;
    font-size: 13.5px;
    line-height: 1.4;
    outline: none;
  }

  #vassian-faq-widget .chat-input:focus {
    border-color: var(--accent);
  }

  #vassian-faq-widget .chat-send {
    background: var(--accent);
    color: #fff;
    border: none;
    border-radius: 10px;
    padding: 9px 14px;
    font-size: 13px;
    cursor: pointer;
  }

  #vassian-faq-widget .chat-send:disabled {
    opacity: 0.5;
    cursor: default;
  }
</style>

<script>
(function () {
  // Guard #1: script body executed twice (e.g. snippet pasted more than once).
  if (window.__vassianFaqWidgetLoaded) return;
  window.__vassianFaqWidgetLoaded = true;

  function init() {
    // Guard #2: DOM already present (belt-and-suspenders alongside the flag above).
    if (document.getElementById("vassian-faq-widget")) return;

    var API_URL = "https://faq.vassian-ai.ru/chat";
    var SESSION_STORAGE_KEY = "vassian_chat_session_id";
    var GREETED_STORAGE_KEY = "vassian_chat_greeted";

    // --- build widget DOM (head script has no <body> to attach to until now) ---
    var root = document.createElement("div");
    root.id = "vassian-faq-widget";

    var launcher = document.createElement("button");
    launcher.className = "chat-launcher";
    launcher.id = "chat-launcher";
    launcher.setAttribute("aria-label", "Открыть чат");
    launcher.textContent = "💬";

    var widget = document.createElement("div");
    widget.className = "chat-widget";
    widget.id = "chat-widget";

    var header = document.createElement("div");
    header.className = "chat-header";

    var headerLeft = document.createElement("div");
    var headerTitle = document.createElement("div");
    headerTitle.className = "chat-header-title";
    headerTitle.textContent = "AI-консультант Владимира";
    var headerSubtitle = document.createElement("div");
    headerSubtitle.className = "chat-header-subtitle";
    headerSubtitle.textContent = "Отвечает на основе базы знаний vassian.ru";
    headerLeft.appendChild(headerTitle);
    headerLeft.appendChild(headerSubtitle);

    var closeBtn = document.createElement("button");
    closeBtn.className = "chat-close";
    closeBtn.id = "chat-close";
    closeBtn.setAttribute("aria-label", "Закрыть чат");
    closeBtn.textContent = "✕";

    header.appendChild(headerLeft);
    header.appendChild(closeBtn);

    var messagesEl = document.createElement("div");
    messagesEl.className = "chat-messages";
    messagesEl.id = "chat-messages";

    var footer = document.createElement("div");
    footer.className = "chat-footer";

    var inputEl = document.createElement("textarea");
    inputEl.id = "chat-input";
    inputEl.className = "chat-input";
    inputEl.rows = 1;
    inputEl.placeholder = "Напишите вопрос...";

    var sendBtn = document.createElement("button");
    sendBtn.id = "chat-send";
    sendBtn.className = "chat-send";
    sendBtn.textContent = "Отправить";

    footer.appendChild(inputEl);
    footer.appendChild(sendBtn);

    widget.appendChild(header);
    widget.appendChild(messagesEl);
    widget.appendChild(footer);

    root.appendChild(launcher);
    root.appendChild(widget);

    document.body.appendChild(root);

    // --- same behavior/logic as the widget everywhere else ---
    var isSending = false;

    function appendMessage(text, kind) {
      var div = document.createElement("div");
      div.className = "chat-message " + kind;
      div.textContent = text; // never innerHTML - no HTML/script injection from user or model text
      messagesEl.appendChild(div);
      messagesEl.scrollTop = messagesEl.scrollHeight;
      return div;
    }

    function getSessionId() {
      return sessionStorage.getItem(SESSION_STORAGE_KEY) || null;
    }

    function setSessionId(sessionId) {
      sessionStorage.setItem(SESSION_STORAGE_KEY, sessionId);
    }

    function sendMessage() {
      if (isSending) return;
      var text = inputEl.value.trim();
      if (!text) return;

      appendMessage(text, "user");
      inputEl.value = "";
      inputEl.style.height = "auto";

      isSending = true;
      sendBtn.disabled = true;
      var statusEl = appendMessage("Ассистент отвечает...", "status");

      var payload = { message: text };
      var existingSessionId = getSessionId();
      if (existingSessionId) {
        payload.session_id = existingSessionId; // reuse - never generated client-side
      }

      fetch(API_URL, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(payload),
      })
        .then(function (response) {
          if (!response.ok) {
            throw new Error("HTTP " + response.status);
          }
          return response.json();
        })
        .then(function (data) {
          statusEl.remove();
          if (data.session_id) {
            setSessionId(data.session_id);
          }
          appendMessage(data.answer, "assistant");
        })
        .catch(function () {
          statusEl.remove();
          appendMessage("Не удалось получить ответ. Попробуйте ещё раз чуть позже.", "error");
        })
        .finally(function () {
          isSending = false;
          sendBtn.disabled = false;
          inputEl.focus();
        });
    }

    launcher.addEventListener("click", function () {
      widget.classList.add("open");
      launcher.style.display = "none";
      if (!sessionStorage.getItem(GREETED_STORAGE_KEY)) {
        appendMessage(
          "Здравствуйте! Я AI-консультант Владимира. Спросите об услугах, кейсах или условиях работы.",
          "assistant"
        );
        sessionStorage.setItem(GREETED_STORAGE_KEY, "1");
      }
      inputEl.focus();
    });

    closeBtn.addEventListener("click", function () {
      widget.classList.remove("open");
      launcher.style.display = "flex";
    });

    sendBtn.addEventListener("click", sendMessage);

    inputEl.addEventListener("keydown", function (e) {
      if (e.key === "Enter" && !e.shiftKey) {
        e.preventDefault();
        sendMessage();
      }
      // Shift+Enter falls through to the textarea's default newline behavior
    });

    inputEl.addEventListener("input", function () {
      inputEl.style.height = "auto";
      inputEl.style.height = Math.min(inputEl.scrollHeight, 90) + "px";
    });
  }

  // <head> scripts run before <body> exists - wait for DOMContentLoaded,
  // unless the page has (unusually) already finished loading by the time this runs.
  if (document.readyState === "loading") {
    document.addEventListener("DOMContentLoaded", init);
  } else {
    init();
  }
})();
</script>
